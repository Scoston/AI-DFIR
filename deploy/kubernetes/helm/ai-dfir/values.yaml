replicaCount: 3
image:
  repository: ghcr.io/REPLACE/ai-dfir
  digest: "sha256:REPLACE"
service:
  port: 8890
resources:
  requests: {cpu: "500m", memory: "1Gi"}
  limits: {cpu: "2", memory: "4Gi"}
serviceAccount:
  create: true
  name: ai-dfir
networkPolicy:
  allowedNamespaces: ["ai-dfir-system"]
podDisruptionBudget:
  minAvailable: 2
config:
  environment: production
  metadataDsnSecret: ai-dfir-metadata
  oidcSecret: ai-dfir-oidc
  objectStoreSecret: ai-dfir-object-store
