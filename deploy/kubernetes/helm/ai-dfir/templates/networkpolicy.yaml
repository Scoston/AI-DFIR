apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ai-dfir-default-deny}
spec:
  podSelector: {matchLabels: {app: ai-dfir}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai-dfir-system}}
    ports: [{protocol: TCP, port: 8890}]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai-dfir-system}}
