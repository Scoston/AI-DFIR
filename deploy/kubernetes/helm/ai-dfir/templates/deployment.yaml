apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-dfir}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: ai-dfir}}
  template:
    metadata: {labels: {app: ai-dfir}}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: ai-dfir
        image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: {{ .Values.service.port }}}]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources: {{ toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: runtime, mountPath: /var/lib/ai-dfir}
        readinessProbe: {httpGet: {path: /healthz, port: {{ .Values.service.port }}}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /healthz, port: {{ .Values.service.port }}}, initialDelaySeconds: 15, periodSeconds: 20}
      volumes:
      - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
      - {name: runtime, emptyDir: {sizeLimit: 2Gi}}
