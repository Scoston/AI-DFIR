name: A2A v1.8 Qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Compile A2A capture and qualification code
        run: |
          python -m py_compile \
            v18_agent_execution_record.py \
            v18_a2a_forensics.py \
            scripts/qualify_a2a_v18.py

      - name: Qualify bounded synthetic A2A population
        run: |
          python scripts/qualify_a2a_v18.py \
            --exchanges 512 \
            --agents 8 \
            --stream-events 128 \
            --out-dir "${{ runner.temp }}/a2a-v18-qualification"

      - name: Retain A2A qualification observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a2a-v18-qualification
          path: ${{ runner.temp }}/a2a-v18-qualification/
          retention-days: 14
          if-no-files-found: warn
