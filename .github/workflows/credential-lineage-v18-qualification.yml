name: Credential Lineage v1.8 Qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Compile credential lineage and qualification code
        run: |
          python -m py_compile \
            v18_agent_execution_record.py \
            v18_credential_lineage.py \
            scripts/qualify_credential_lineage_v18.py

      - name: Run credential lineage regressions
        run: python -m pytest tests/test_v18_credential_lineage.py -q

      - name: Qualify bounded synthetic credential lineage population
        run: |
          python scripts/qualify_credential_lineage_v18.py \
            --hops 512 \
            --principals 16 \
            --out-dir "${{ runner.temp }}/credential-lineage-v18-qualification"

      - name: Retain credential lineage qualification observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: credential-lineage-v18-qualification
          path: ${{ runner.temp }}/credential-lineage-v18-qualification/
          retention-days: 14
          if-no-files-found: warn
