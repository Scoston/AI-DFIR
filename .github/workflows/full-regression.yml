name: Full Regression
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: python scripts/release_check.py --full
      - name: Install optional coverage fuzzing engine
        run: |
          python -m pip install --only-binary=:all: -r requirements-fuzz.txt
      - name: Larger coverage-guided campaign with a rotating seed
        env:
          FUZZ_RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/run_coverage_fuzz_v17.py --runs 20000 --seed "$((FUZZ_RUN_NUMBER % 4294967295 + 1))" --out-dir "${{ runner.temp }}/coverage-fuzz"
      - name: Retain coverage fuzzing results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-fuzz-full
          path: |
            ${{ runner.temp }}/coverage-fuzz/report.json
            ${{ runner.temp }}/coverage-fuzz/engine.log
            ${{ runner.temp }}/coverage-fuzz/failures/
          retention-days: 14
          if-no-files-found: warn
