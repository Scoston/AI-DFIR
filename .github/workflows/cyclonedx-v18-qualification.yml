name: CycloneDX v1.8 Qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install qualification test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<9"

      - name: Validate qualification harness behavior
        run: python -m pytest tests/test_v18_cyclonedx_qualification.py -q

      - name: Download checksum-pinned CycloneDX validator
        env:
          SBOM_UTILITY_VERSION: '0.19.2'
          SBOM_UTILITY_ARCHIVE_SHA256: 'e0cd37e6e67b1d0e44dbb7b38e055a4e2ee66db590bb8e7f89e2d9b650f4490b'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/sbom-utility-v${SBOM_UTILITY_VERSION}-linux-amd64.tar.gz"
          url="https://github.com/CycloneDX/sbom-utility/releases/download/v${SBOM_UTILITY_VERSION}/sbom-utility-v${SBOM_UTILITY_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 --output "$archive" "$url"
          echo "${SBOM_UTILITY_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/sbom-utility"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/sbom-utility"
          validator="${RUNNER_TEMP}/sbom-utility/sbom-utility"
          test -x "$validator"
          "$validator" schema list -q | grep -E 'CycloneDX.*1\.7|1\.7.*CycloneDX'
          echo "SBOM_VALIDATOR=${validator}" >> "$GITHUB_ENV"

      - name: Qualify actual CycloneDX 1.7 projection offline
        env:
          SBOM_UTILITY_ARCHIVE_SHA256: 'e0cd37e6e67b1d0e44dbb7b38e055a4e2ee66db590bb8e7f89e2d9b650f4490b'
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/cyclonedx-v18-qualification"
          sudo unshare --net -- "$(command -v python)" scripts/qualify_cyclonedx_v18.py \
            --validator "$SBOM_VALIDATOR" \
            --validator-version '0.19.2' \
            --validator-archive-sha256 "$SBOM_UTILITY_ARCHIVE_SHA256" \
            --network-isolated \
            --out-dir "$out"

      - name: Retain CycloneDX qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cyclonedx-v18-qualification
          path: ${{ runner.temp }}/cyclonedx-v18-qualification/
          retention-days: 14
          if-no-files-found: warn
