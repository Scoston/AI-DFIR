name: Isolated PDF Rendering

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12', cache: pip}
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt pytest PyYAML
      - name: Validate protocol and isolation rejection tests
        run: |
          python -m pytest tests/test_v17_pdf_render.py -q
          python -m pytest tests/test_v17_png_ocr.py -q
      - name: Build pinned-base renderer image
        env:
          PYTHON_IMAGE: ${{ vars.AI_DFIR_PYTHON_BASE_IMAGE_DIGEST }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"[a-z0-9][a-z0-9./:_-]+@sha256:[0-9a-f]{64}", os.environ["PYTHON_IMAGE"])'
          docker build --build-arg "PYTHON_IMAGE=$PYTHON_IMAGE" --file deploy/render/Dockerfile --tag ai-dfir-render:qualification .
      - name: Qualify actual isolated rendering and OCR
        run: |
          render_image_id="$(docker image inspect --format '{{.Id}}' ai-dfir-render:qualification)"
          python scripts/qualify_pdf_render_v17.py --image-id "$render_image_id" --out-dir "${{ runner.temp }}/pdf-render-qualification"
      - name: Qualify actual PNG bridge and isolated OCR
        run: |
          render_image_id="$(docker image inspect --format '{{.Id}}' ai-dfir-render:qualification)"
          python scripts/qualify_png_ocr_v17.py --image-id "$render_image_id" --out-dir "${{ runner.temp }}/png-ocr-qualification"
      - name: Retain synthetic PDF qualification observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pdf-render-qualification
          path: ${{ runner.temp }}/pdf-render-qualification/
          retention-days: 14
          if-no-files-found: warn
      - name: Retain synthetic PNG qualification observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: png-ocr-qualification
          path: ${{ runner.temp }}/png-ocr-qualification/
          retention-days: 14
          if-no-files-found: warn
