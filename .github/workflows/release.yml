name: Release + SLSA Provenance

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[1-9][0-9]*)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi

          version="${release_tag#v}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.meta.outputs.release_tag }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Full release gate
        run: python scripts/release_check.py --full

      - name: Show disk before packaging
        shell: bash
        run: df -h

      - name: Build release assets outside repository workspace
        shell: bash
        env:
          AI_DFIR_RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          python scripts/package_release.py \
            --out-dir "$RUNNER_TEMP/dist-release" \
            --skip-source-check

      - name: Show disk after packaging
        shell: bash
        run: |
          df -h
          du -sh "$RUNNER_TEMP/dist-release"

      - name: Verify v1.7 packaged release assurance
        if: startsWith(steps.meta.outputs.version, '1.7.')
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python scripts/verify_release_candidate_v17.py \
            --release-dir "$RUNNER_TEMP/dist-release" \
            --version "$VERSION"

      - name: Generate SLSA subjects
        id: hash
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist-release"

          zip_name="AI-DFIR-v${VERSION}.zip"
          tar_name="AI-DFIR-v${VERSION}.tar.gz"

          test -f "$zip_name"
          test -f "$tar_name"

          hashes="$(sha256sum "$zip_name" "$tar_name" | base64 -w0)"
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist-release/
          if-no-files-found: error

  provenance:
    needs: [build]

    permissions:
      actions: read
      id-token: write
      contents: write

    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0

    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: ${{ needs.build.outputs.release_tag }}
      compile-generator: true

  publish:
    needs: [build, provenance]

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.release_tag }}
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-assets
          path: release-assets

      - name: Apply release title and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          exact_notes="RELEASE_NOTES_V${version}.md"
          series="${version%.*}"
          series_notes="RELEASE_NOTES_V${series}.md"

          if [[ -f "$exact_notes" ]]; then
            notes_file="$exact_notes"
          elif [[ -f "$series_notes" ]]; then
            notes_file="$series_notes"
          else
            echo "No release notes found for $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$series" == "1.7" ]]; then
            title="AI-DFIR $RELEASE_TAG — Investigation Integrity & Offline Verification"
          else
            title="AI-DFIR $RELEASE_TAG — Production Assurance & Hardened Enterprise Deployment"
          fi

          prerelease_args=()
          if [[ "$version" =~ -rc[1-9][0-9]*$ ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file "$notes_file" \
            "${prerelease_args[@]}"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber