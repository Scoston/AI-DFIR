name: Release + SLSA Provenance
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Full release gate
        run: python scripts/release_check.py --full
      - name: Build release assets
        run: python scripts/package_release.py --out-dir dist-release --skip-source-check
      - name: Generate SLSA subjects
        id: hash
        shell: bash
        run: |
          cd dist-release
          echo "hashes=$(sha256sum AI-DFIR-v1.6.0.zip AI-DFIR-v1.6.0.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist-release/
          if-no-files-found: error
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
  publish:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v7
        with: {name: release-assets, path: release-assets}
      - name: Publish GitHub release assets
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
