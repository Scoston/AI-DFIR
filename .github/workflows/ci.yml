name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install quick-gate dependencies
        run: python -m pip install -r requirements.txt

      - name: Quick release gate
        run: python scripts/release_check.py --quick

      - name: Install optional CASE validation tools
        run: python -m pip install -r requirements-case-validation.txt

      - name: CASE/UCO conformance and RDF round trip
        run: python scripts/case_exchange_conformance_v17.py

      - name: Install optional coverage fuzzing engine
        run: |
          python -m pip install --only-binary=:all: -r requirements-fuzz.txt

      - name: Coverage-guided parser and archive campaign
        run: python scripts/run_coverage_fuzz_v17.py --runs 5000 --out-dir "${{ runner.temp }}/coverage-fuzz"

      - name: Retain coverage fuzzing results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-fuzz-ci
          path: |
            ${{ runner.temp }}/coverage-fuzz/report.json
            ${{ runner.temp }}/coverage-fuzz/engine.log
            ${{ runner.temp }}/coverage-fuzz/failures/
          retention-days: 14
          if-no-files-found: warn
